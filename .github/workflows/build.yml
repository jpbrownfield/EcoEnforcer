name: Build EcoEnforcer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=eco_enforcer --cov-report=term-missing --cov-fail-under=80

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller --onefile --noconsole --name EcoEnforcer eco_enforcer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoEnforcer-windows
          path: dist/EcoEnforcer.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EcoEnforcer.exe
