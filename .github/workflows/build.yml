name: Build EcoEnforcer

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: {}
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=eco_enforcer --cov-report=term-missing --cov-fail-under=80

  # Auto-bumps a minor version tag on every push to main (default_bump: minor below).
  # A commit message containing "@x.y.z" overrides the computed version entirely via
  # custom_tag. Note: a tag pushed using the default GITHUB_TOKEN does NOT re-trigger this
  # workflow (GitHub suppresses that to prevent infinite loops), so the release below is
  # created directly in this same run via the tag job's output rather than relying on a
  # second, tag-triggered run.
  tag:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version override in commit message
        id: version_override
        shell: bash
        run: |
          MSG=${{ toJSON(github.event.head_commit.message) }}
          if [[ "$MSG" =~ @([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "custom_tag=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "custom_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          custom_tag: ${{ steps.version_override.outputs.custom_tag }}
          tag_prefix: v

  build:
    needs: [test, tag]
    if: always() && needs.test.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write version file
        shell: bash
        run: |
          TAG="${{ needs.tag.outputs.new_tag || github.ref_name }}"
          echo "${TAG#v}" > version.txt
          cat version.txt

      - name: Build executable
        run: pyinstaller --onefile --noconsole --name EcoEnforcer --add-data "version.txt;." eco_enforcer.py

      - name: Sign executable
        if: env.CODE_SIGN_PFX_BASE64 != ''
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfxPath /p $env:CODE_SIGN_PFX_PASSWORD /fd SHA256 /t http://timestamp.digicert.com dist\EcoEnforcer.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          Remove-Item $pfxPath -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoEnforcer-windows
          path: dist/EcoEnforcer.exe

      - name: Create GitHub release
        if: needs.tag.outputs.new_tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag || github.ref_name }}
          files: dist/EcoEnforcer.exe
