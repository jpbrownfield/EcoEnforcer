name: Build EcoEnforcer

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: {}
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=eco_enforcer --cov-report=term-missing --cov-fail-under=80

  # Auto-bumps a patch version tag on every push to main; the tag push below re-triggers
  # this workflow (matching the `tags: v*` filter), and the build job's existing
  # tag-only release step then does the actual packaging/publishing for that new tag.
  tag:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller --onefile --noconsole --name EcoEnforcer eco_enforcer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoEnforcer-windows
          path: dist/EcoEnforcer.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EcoEnforcer.exe
